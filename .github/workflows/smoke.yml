name: Smoke

on:
  # Manual on-demand runs.
  workflow_dispatch:
  # On every PR: the harness itself (smoke.sh / token.sh / clients) is what
  # changes here, so run the matrix against the published packages to catch a
  # broken cell before it merges. Published-package regressions still surface
  # nightly; this guards changes to the test.
  pull_request:
  # Nightly: catches breakage from a freshly published wheel / formula / .deb /
  # npm / go module that a developer wouldn't notice until a user hit it.
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    # The matrix runs in real time (ffmpeg -re pacing + per-subscriber timeouts);
    # this is just a safety net against a hung relay/client.
    timeout-minutes: 45

    # smoke.sh resolves the latest libmoq release via the GitHub API. Without a
    # token that call is anonymous (60 req/hr per IP), which the heavily-NAT'd
    # macOS runners routinely exhaust -> "no libmoq-v* release found" -> the C
    # subscriber drops out and every "* -> c" case fails. Authenticating lifts
    # the limit to 1000 req/hr per token.
    env:
      GITHUB_TOKEN: ${{ github.token }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Rust binaries ship through three channels that install the same
          # thing; we test each separately where the OS supports it. The Python /
          # Go / browser clients always come from their own registries.
          - os: ubuntu-latest
            channel: cargo
          - os: ubuntu-latest
            channel: apt
          # The moq flake is itself a public channel (nix run github:moq-dev/moq).
          - os: ubuntu-latest
            channel: nix
          # Docker Hub (moqdev/moq-relay + moqdev/moq-cli). Linux only: the
          # wrappers use `--network host`, which needs a native Docker daemon
          # (GitHub's macOS runners have none).
          - os: ubuntu-latest
            channel: docker
          # macOS cells temporarily disabled to cut CI spend (over budget this
          # month). Re-enable by uncommenting; nothing else depends on them.
          # - os: macos-latest
          #   channel: cargo
          # - os: macos-latest
          #   channel: brew
          # - os: macos-latest
          #   channel: nix

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # ── client toolchains ──────────────────────────────────────────────
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "8.14.4"

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gcc (cc) for the C client is already on the runner, but g++ isn't:
          # libmoq.a bundles openh264, so static consumers need libstdc++ to link.
          # libva-dev is not a real dependency (moq-vaapi dlopen's libva and
          # libmoq.a has no libva symbols); it's here only because libmoq's
          # published moq.pc and CMake package still advertise -lva/-lva-drm, so
          # the c-pkgconfig and c-cmake variants pass them to the linker. Drop it
          # once a libmoq release ships without those. The hand-rolled `c` variant
          # already omits them, see LIBMOQ_OS_LIBS in smoke.sh.
          # gstreamer1.0-* provides gst-launch/gst-inspect + the core elements
          # (filesink) the moq-gst subscriber loads the prebuilt plugin against.
          # pkg-config + cmake drive the c-pkgconfig / c-cmake build variants
          # (they consume the prebuilt libmoq's moq.pc and lib/cmake/moq package).
          sudo apt-get install -y ffmpeg curl procps coreutils jq pkg-config cmake g++ libva-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # clang (cc) for the C client and swift for the Swift client ship with Xcode.
          # pkg-config + cmake drive the c-pkgconfig / c-cmake build variants.
          # gstreamer is the system runtime the prebuilt moq-gst plugin links against.
          brew install ffmpeg coreutils jq pkg-config cmake gstreamer
          # GNU coreutils provides `timeout` (macOS ships neither it nor pgrep
          # under those names by default; pgrep exists, timeout does not).
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # ── Rust binaries, per channel (left on PATH for smoke.sh) ──────────
      - name: Install moq Rust packages (cargo)
        if: matrix.channel == 'cargo'
        # Honor each published binary crate's Cargo.lock. Without --locked, the
        # cargo channel can select a newly broken transitive dependency even when
        # the crate was published and tested against a working resolution.
        run: cargo install --locked moq-relay moq-cli moq-token-cli

      - name: Install moq Rust packages (apt)
        if: matrix.channel == 'apt'
        run: |
          curl -fsSL https://apt.moq.dev/moq-keyring.gpg \
            | sudo tee /usr/share/keyrings/moq-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/moq-keyring.gpg] https://apt.moq.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/moq.list
          sudo apt-get update
          sudo apt-get install -y moq-relay moq-cli moq-token-cli

      - name: Install moq Rust packages (brew)
        if: matrix.channel == 'brew'
        run: |
          brew tap moq-dev/tap
          brew install moq-dev/tap/moq-relay moq-dev/tap/moq-cli moq-dev/tap/moq-token-cli

      - name: Install Nix (nix channel)
        if: matrix.channel == 'nix'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Build moq from the flake (nix channel)
        if: matrix.channel == 'nix'
        # --refresh so we always build the latest moq, never a cached eval; the
        # moq flake is referenced ad-hoc here, so its version is never locked.
        run: |
          relay=$(nix build --refresh --no-link --print-out-paths 'github:moq-dev/moq#moq-relay')
          cli=$(nix build --refresh --no-link --print-out-paths 'github:moq-dev/moq#moq-cli')
          token=$(nix build --refresh --no-link --print-out-paths 'github:moq-dev/moq#moq-token-cli')
          {
            echo "RELAY_BIN=$relay/bin/moq-relay"
            echo "MOQ_BIN=$cli/bin/moq"
            echo "TOKEN_BIN=$token/bin/moq-token"
          } >> "$GITHUB_ENV"

      - name: Pull moqdev images (docker channel)
        if: matrix.channel == 'docker'
        # Pull :latest fresh, then point smoke.sh at the wrapper scripts (which
        # `docker run --network host` the images) via RELAY_BIN/MOQ_BIN. Docker is
        # preinstalled on the Linux runners.
        run: |
          docker pull moqdev/moq-relay
          docker pull moqdev/moq-cli
          {
            echo "RELAY_BIN=$PWD/clients/docker/moq-relay"
            echo "MOQ_BIN=$PWD/clients/docker/moq"
          } >> "$GITHUB_ENV"

      # ── browser deps (Chromium runtime libs on Linux) ──────────────────
      - name: Playwright system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          cd clients/js
          bun install
          bunx playwright install-deps chromium

      # Fail loudly if we've drifted off "latest": a committed lock file, a moq
      # package that stopped being requested at latest, or a stale playwright pin.
      - name: Freshness
        run: ./freshness.sh

      # ── run the full interop matrix ────────────────────────────────────
      # Publishers: rust, python, and the three browser variants publish today;
      # go/swift/kotlin/c/gst subscribe only (go builds on Linux against the
      # published moq-go module; gst resolves the latest moq-gst-v* release).
      # Browser variants: js-vite, js-esbuild (bundlers), js-jsdelivr (CDN).
      # Swift needs the Xcode toolchain, so it's a macOS-only subscriber.
      # --timeout 30 gives headless Chromium cold-start headroom.
      - name: Smoke
        run: |
          browser="js-vite,js-esbuild,js-jsdelivr"
          # Both run moq's @moq/web-transport polyfill. node briefly failed on the
          # polyfill's napi CJS named-import; fixed in @moq/web-transport 0.1.2.
          native="js-native-node,js-native-bun"
          # c / c-pkgconfig / c-cmake: same libmoq client built three ways, to
          # exercise the moq.pc and CMake-package consumer paths, not just -I/-L.
          subs="rust,python,go,kotlin,c,c-pkgconfig,c-cmake,gst,$browser,$native"
          if [ "$RUNNER_OS" = "macOS" ]; then subs="$subs,swift"; fi
          ./smoke.sh \
            --publishers "rust,python,$browser" \
            --subscribers "$subs" \
            --timeout 30

      # Quick proof the harness can actually report failure.
      - name: Negative control
        run: ./smoke.sh --negative --subscribers rust,python

      # ── token interop ──────────────────────────────────────────────────
      # Independent of the media matrix: prove the published token tooling
      # cross-verifies. moq-token rides the same channel as moq-relay/moq
      # (cargo/apt/brew/nix, on PATH or TOKEN_BIN); @moq/token comes from npm and
      # runs under both node and bun; rust-docker pulls the moqdev/moq-token-cli
      # image. The negative pass inside token.sh confirms each verifier rejects
      # tampered tokens and the wrong key.
      - name: Token interop
        run: |
          # The `rust` impl needs moq-token on PATH, which only the
          # cargo/apt/brew/nix channels install. The docker channel ships no such
          # binary, so it exercises the Rust verifier through the
          # moqdev/moq-token-cli image (rust-docker) instead of plain `rust`.
          if [ "${{ matrix.channel }}" = "docker" ]; then
            impls="js-node,js-bun,rust-docker"
          else
            impls="rust,js-node,js-bun"
            # The Docker cell needs a daemon; GitHub's macOS runners have none, so
            # it's Linux-only. (Docker is preinstalled on the Linux runners.)
            if [ "$RUNNER_OS" = "Linux" ]; then impls="$impls,rust-docker"; fi
          fi
          ./token.sh --generators "$impls" --verifiers "$impls"

  cloudflare:
    name: Cloudflare interoperability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Both projects are built from Git HEAD; the six runtime checks are quick.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Cloudflare interoperability
        run: ./cloudflare.sh

  moxygen:
    name: Moxygen interoperability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The published client image and moq-dev relay both follow Git HEAD. Building
    # the Rust relay is the long pole; the 12 protocol cases are bounded and quick.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Moxygen interoperability
        # Current moq-dev HEAD negotiates successfully but fails moxygen's
        # announce-subscribe case. Keep the full diagnostic visible without
        # failing the job; remove this once that protocol mismatch is fixed.
        continue-on-error: true
        run: ./moxygen.sh

name: Smoke

on:
  # Manual on-demand runs.
  workflow_dispatch:
  # Nightly: catches breakage from a freshly published wheel / formula / .deb /
  # npm / go module that a developer wouldn't notice until a user hit it.
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    # The matrix runs in real time (ffmpeg -re pacing + per-subscriber timeouts);
    # this is just a safety net against a hung relay/client.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Rust binaries ship through three channels that install the same
          # thing; we test each separately where the OS supports it. The Python /
          # Go / browser clients always come from their own registries.
          - os: ubuntu-latest
            channel: cargo
          - os: ubuntu-latest
            channel: apt
          - os: macos-latest
            channel: cargo
          - os: macos-latest
            channel: brew
          # The moq flake is itself a public channel (nix run github:moq-dev/moq).
          - os: ubuntu-latest
            channel: nix
          - os: macos-latest
            channel: nix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── client toolchains ──────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gcc (cc) for the C client is already on the runner.
          sudo apt-get install -y ffmpeg curl procps coreutils jq

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # clang (cc) for the C client and swift for the Swift client ship with Xcode.
          brew install ffmpeg coreutils jq
          # GNU coreutils provides `timeout` (macOS ships neither it nor pgrep
          # under those names by default; pgrep exists, timeout does not).
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # ── Rust binaries, per channel (left on PATH for smoke.sh) ──────────
      - name: Install moq-relay + moq-cli (cargo)
        if: matrix.channel == 'cargo'
        run: cargo install moq-relay moq-cli

      - name: Install moq-relay + moq-cli (apt)
        if: matrix.channel == 'apt'
        run: |
          curl -fsSL https://apt.moq.dev/moq-archive-keyring.gpg \
            | sudo tee /usr/share/keyrings/moq-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/moq-archive-keyring.gpg] https://apt.moq.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/moq.list
          sudo apt-get update
          sudo apt-get install -y moq-relay moq-cli

      - name: Install moq-relay + moq-cli (brew)
        if: matrix.channel == 'brew'
        run: |
          brew tap moq-dev/tap
          brew install moq-dev/tap/moq-relay moq-dev/tap/moq-cli

      - name: Install Nix (nix channel)
        if: matrix.channel == 'nix'
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Build moq from the flake (nix channel)
        if: matrix.channel == 'nix'
        # --refresh so we always build the latest moq, never a cached eval; the
        # moq flake is referenced ad-hoc here, so its version is never locked.
        run: |
          relay=$(nix build --refresh --no-link --print-out-paths 'github:moq-dev/moq#moq-relay')
          cli=$(nix build --refresh --no-link --print-out-paths 'github:moq-dev/moq#moq-cli')
          echo "RELAY_BIN=$relay/bin/moq-relay" >> "$GITHUB_ENV"
          echo "MOQ_BIN=$cli/bin/moq-cli" >> "$GITHUB_ENV"

      # ── browser deps (Chromium runtime libs on Linux) ──────────────────
      - name: Playwright system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          cd clients/js
          bun install
          bunx playwright install-deps chromium

      # Fail loudly if we've drifted off "latest": a committed lock file, a moq
      # package that stopped being requested at latest, or a stale playwright pin.
      - name: Freshness
        run: ./freshness.sh

      # ── run the full interop matrix ────────────────────────────────────
      # Publishers: rust, python, and the three browser variants publish today;
      # go/swift/kotlin/c subscribe only (go's module is also currently broken).
      # Browser variants: js-vite, js-esbuild (bundlers), js-jsdelivr (CDN).
      # Swift needs the Xcode toolchain, so it's a macOS-only subscriber.
      # --timeout 30 gives headless Chromium cold-start headroom.
      - name: Smoke
        run: |
          browser="js-vite,js-esbuild,js-jsdelivr"
          # js-native-node works; js-native-bun currently crashes Bun (the
          # WebTransport polyfill's native addon segfaults) -- kept to track the fix.
          native="js-native-node,js-native-bun"
          subs="rust,python,go,kotlin,c,$browser,$native"
          if [ "$RUNNER_OS" = "macOS" ]; then subs="$subs,swift"; fi
          ./smoke.sh \
            --publishers "rust,python,$browser" \
            --subscribers "$subs" \
            --timeout 30

      # Quick proof the harness can actually report failure.
      - name: Negative control
        run: ./smoke.sh --negative --subscribers rust,python
